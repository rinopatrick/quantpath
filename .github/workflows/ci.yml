name: CI
on:
  push:
    branches: ["main", "master"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Supabase client validates these at module load during Next.js prerender.
      # CI does not query Supabase, so non-secret placeholders are sufficient.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate curriculum data
        run: npm run validate:data
      - name: Lint
        run: npm run lint
      - name: Test (optional)
        run: npm test --if-present
      - name: Build
        run: npm run build
